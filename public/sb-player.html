<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Player</title>
    <link rel="stylesheet" href="/sb-player.css" />
  </head>
  <body>
    <div id="sb" class="sb is-paused show-ui" tabindex="-1">
      <video id="v" playsinline webkit-playsinline preload="auto"></video>

      <!-- gesture feedback -->
      <div class="ripple ripple-l" aria-hidden="true"><div class="ripple-wave"></div><div class="bubble"><svg viewBox="0 0 24 24"><path d="M11 6 5 12l6 6M19 6l-6 6 6 6"/></svg><span>10s</span></div></div>
      <div class="ripple ripple-r" aria-hidden="true"><div class="ripple-wave"></div><div class="bubble"><svg viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 6l6 6-6 6"/></svg><span>10s</span></div></div>
      <div class="scrub-hud" aria-hidden="true"><div class="scrub-time">0:00</div><div class="scrub-delta">+0s</div></div>
      <div class="level-hud" aria-hidden="true">
        <div class="level-icon"></div>
        <div class="level-bar"><div class="level-fill"></div></div>
        <div class="level-pct">50</div>
      </div>
      <div class="spinner" aria-hidden="true"><div class="spinner-ring"></div></div>
      <div class="err" role="alert">
        <div class="err-title">Playback error</div>
        <div class="err-msg">Something went wrong.</div>
        <button class="err-retry ctl" type="button">Retry</button>
      </div>

      <!-- controls -->
      <div class="ui">
        <div class="shade shade-top"></div>
        <div class="shade shade-bottom"></div>
        <div class="top">
          <button class="ctl b-close" type="button" aria-label="Close" hidden>
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="title"></div>
          <button class="ctl b-cc" type="button" aria-label="Subtitles" hidden>
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"/></svg>
          </button>
          <button class="ctl b-cast" type="button" aria-label="Cast" hidden>
            <svg viewBox="0 0 24 24"><path d="M3 16a5 5 0 0 1 5 5M3 12a9 9 0 0 1 9 9M3 8V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/><circle cx="3.5" cy="20.5" r=".6" fill="currentColor"/></svg>
          </button>
          <button class="ctl b-pip" type="button" aria-label="Picture in picture">
            <svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><rect x="12" y="11.5" width="7" height="5.5" rx="1" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>

        <div class="center">
          <button class="ctl b-back10" type="button" aria-label="Back 10 seconds">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
            <span>10</span>
          </button>
          <button class="ctl b-play" type="button" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z" fill="currentColor" stroke="none"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="ctl b-fwd10" type="button" aria-label="Forward 10 seconds">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg>
            <span>10</span>
          </button>
        </div>

        <div class="bottom">
          <div class="seek ctl" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
            <div class="seek-rail">
              <div class="seek-buf"></div>
              <div class="seek-fill"></div>
            </div>
            <div class="seek-mover"><div class="seek-thumb"></div></div>
            <div class="seek-tip-mover"><div class="seek-tip">0:00</div></div>
          </div>
          <div class="row">
            <div class="time"><span class="t-cur">0:00</span><span class="t-sep">/</span><span class="t-dur">0:00</span></div>
            <div class="spacer"></div>
            <button class="ctl b-speed pill" type="button" aria-label="Playback speed">1x</button>
            <button class="ctl b-quality pill" type="button" aria-label="Quality" hidden>Auto</button>
            <button class="ctl b-fs" type="button" aria-label="Fullscreen" hidden>
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="menu" role="menu" aria-hidden="true">
        <div class="menu-title"></div>
        <div class="menu-list"></div>
      </div>
    </div>

    <script src="/hls.min.js"></script>
    <script src="/sb-player.js"></script>
  </body>
</html>
